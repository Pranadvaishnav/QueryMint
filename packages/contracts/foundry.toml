[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "../../node_modules"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=../../node_modules/@openzeppelin/"]

[rpc_endpoints]
whitechain_sepolia = "${WHITECHAIN_RPC_URL}"

[etherscan]
whitechain_sepolia = { key = "${WHITECHAIN_EXPLORER_API_KEY}", url = "https://explorer.testnet.whitechain.io/api/" }
